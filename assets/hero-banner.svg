<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="980" cy="90" r="180" fill="#0ea5e9" fill-opacity="0.07" filter="url(#glow)"/>
  <circle cx="220" cy="280" r="160" fill="#8b5cf6" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- Quantitative Alpha Wave / Time-Series Chart Decoration on Right -->
  <path d="M 620 250 Q 670 240, 710 210 T 790 190 T 860 130 T 930 160 T 1010 95 T 1090 110 T 1170 55 L 1170 310 L 620 310 Z" fill="url(#pulseGlow)"/>
  <path d="M 620 250 Q 670 240, 710 210 T 790 190 T 860 130 T 930 160 T 1010 95 T 1090 110 T 1170 55" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Data Nodes on Curve -->
  <circle cx="790" cy="190" r="4" fill="#00f2fe"/>
  <circle cx="860" cy="130" r="4" fill="#38bdf8"/>
  <circle cx="1010" cy="95" r="5" fill="#4facfe" filter="url(#glow)"/>
  <circle cx="1170" cy="55" r="5" fill="#a855f7" filter="url(#glow)">
    <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Anomaly Detection Tag on Chart -->
  <g transform="translate(945, 42)">
    <rect width="138" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="14" cy="14" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="18" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#e2e8f0">ALPHA SIGNAL +3.4σ</text>
  </g>

  <!-- Status Pill Top Left -->
  <g transform="translate(56, 42)">
    <rect width="336" height="28" rx="14" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#94a3b8" letter-spacing="0.8">SYSTEM ONLINE // QUANTITATIVE ML ECOSYSTEM</text>
  </g>

  <!-- Main Heading -->
  <text x="56" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">
    MRCANLACO
  </text>

  <!-- Subtitle -->
  <text x="56" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#38bdf8">
    Quantitative Systems Architect &amp; Financial ML Engineer
  </text>

  <!-- Description -->
  <text x="56" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94a3b8">
    Engineering real-time market anomaly detection engines, walk-forward algorithmic trading studios,
  </text>
  <text x="56" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94a3b8">
    and evidence-first derivatives research platforms.
  </text>

  <!-- Ecosystem Badges Row (Pure 4-Pillar Quant Suite) -->
  <g transform="translate(56, 262)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="172" height="34" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1" stroke-opacity="0.65"/>
    <text x="16" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#818cf8">📈 FreqPilot Studio</text>

    <!-- Pill 2 -->
    <rect x="186" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.65"/>
    <text x="202" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#38bdf8">⚡ PeakPulse AI</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="176" height="34" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.65"/>
    <text x="376" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#fbbf24">📚 Strategy Library</text>

    <!-- Pill 4 -->
    <rect x="550" y="0" width="168" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.65"/>
    <text x="566" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#34d399">🔎 FreqPilot Intel</text>
  </g>
</svg>
